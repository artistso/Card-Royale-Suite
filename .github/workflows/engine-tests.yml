name: Build and test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run pure Kotlin tests
        shell: bash
        run: |
          set +e
          sh ./gradlew :core:cards:test :core:canasta:test :core:solitaire:test :core:protocol:test --console=plain --stacktrace 2>&1 | tee engine-tests.log
          exit ${PIPESTATUS[0]}
      - name: Upload engine diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-log
          path: engine-tests.log

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install stable Android SDK platform
        run: sdkmanager "platforms;android-36"
      - name: Assemble debug application
        shell: bash
        run: |
          set +e
          sh ./gradlew :app:assembleDebug --console=plain --stacktrace 2>&1 | tee android-build.log
          exit ${PIPESTATUS[0]}
      - name: Package installable APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Card-Royale-Suite-v0.1.0-development.apk
          sha256sum dist/Card-Royale-Suite-v0.1.0-development.apk > dist/Card-Royale-Suite-v0.1.0-development.apk.sha256
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Card-Royale-Suite-v0.1.0-development-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
