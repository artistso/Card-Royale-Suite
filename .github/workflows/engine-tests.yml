name: Build and test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run pure Kotlin tests
        run: sh ./gradlew :core:cards:test :core:canasta:test :core:solitaire:test :core:protocol:test

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install stable Android SDK platform
        run: sdkmanager "platforms;android-36"
      - name: Assemble debug application
        run: sh ./gradlew :app:assembleDebug
