name: Engine tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run pure Kotlin tests
        run: ./gradlew :core:cards:test :core:canasta:test :core:solitaire:test :core:protocol:test
